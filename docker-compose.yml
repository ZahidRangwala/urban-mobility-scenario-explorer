version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urban-mobility-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ~/urban-mobility-key.json:/app/creds/key.json  # Mount the key file
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_CLOUD_PROJECT=mystical-app-476502-m4
      - GOOGLE_APPLICATION_CREDENTIALS=/app/creds/key.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s